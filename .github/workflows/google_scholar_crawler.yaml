name: Get Citation Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Test citation data output
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v

      - name: Fetch Google Scholar data
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Check out citation data branch
        uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
          path: .scholar-stats

      - name: Publish citation data
        run: |
          cp google_scholar_crawler/results/gs_data.json .scholar-stats/
          cp google_scholar_crawler/results/gs_data_shieldsio.json .scholar-stats/
          cd .scholar-stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi
          git commit -m 'Update Google Scholar citation data'
          git push origin HEAD:google-scholar-stats
